services:
  # ─── PostgreSQL Database ────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: synctune-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: synctune
      POSTGRES_PASSWORD: synctune_secure_password_2026
      POSTGRES_DB: synctune
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synctune -d synctune"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - synctune-network

  # ─── SyncTune Backend Server ────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: synctune-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://synctune:synctune_secure_password_2026@db:5432/synctune?schema=public
      JWT_SECRET: production-secret-synctune-jwt-key-change-in-prod
      JWT_EXPIRES_IN: 7d
      APP_URL: https://jemaw.live
      CORS_ORIGIN: "https://jemaw.live,http://jemaw.live,https://www.jemaw.live,http://www.jemaw.live,http://63.176.157.176,http://localhost:5173,*"
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - synctune-network

  # ─── SyncTune Web Frontend (Nginx + SSL) ─────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: synctune-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./apps/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - synctune-network

  # ─── Certbot for SSL Certificate Renewal ─────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: synctune-certbot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ""
    command: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - synctune-network

volumes:
  postgres_data:
    driver: local

networks:
  synctune-network:
    driver: bridge
