name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm --filter @synctune/server exec prisma generate

      - name: Build Packages & Apps
        run: pnpm run build

  build-and-push-images:
    name: Build & Push Docker Images
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/abuchu251/synctune-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/abuchu251/synctune-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS Lightsail
    needs: build-and-push-images
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment on Remote Host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          command_timeout: 10m
          timeout: 10m
          script_stop: true
          script: |
            echo "Starting SyncTune continuous deployment..."
            echo "Checking disk space and cleaning up unused Docker artifacts..."
            df -h /
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            df -h /

            cd /home/ubuntu/synctune
            git pull origin main
            chmod +x ./init-ssl.sh 2>/dev/null || true

            echo "Authenticating with GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling pre-built production container images..."
            docker compose pull web server

            echo "Starting containers..."
            docker compose up -d --remove-orphans

            echo "Pruning superseded Docker images..."
            docker image prune -af || true

            echo "Applying database schema migrations..."
            docker exec synctune-server npx prisma db push --skip-generate

            # Check and provision Let's Encrypt SSL certificate if not yet present
            if [ ! -f ./certbot/conf/live/jemaw.live/privkey.pem ] || grep -q "localhost" ./certbot/conf/live/jemaw.live/fullchain.pem 2>/dev/null; then
              echo "Requesting Let's Encrypt SSL certificate for jemaw.live and www.jemaw.live..."
              docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
                -d jemaw.live -d www.jemaw.live \
                --email admin@jemaw.live --agree-tos --no-eff-email || true
              docker compose exec -T web nginx -s reload || true
            fi

            echo "SyncTune deployed successfully with HTTPS!"
